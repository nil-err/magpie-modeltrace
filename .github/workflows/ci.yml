name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["22.14", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Neither the page nor the plugin has dependencies, so there is nothing
      # to install: that is part of the point — nothing to audit, nothing to pin.
      - run: node --version
      - run: npm test

  build:
    name: The site builds and its bank matches provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      # build.mjs hashes data/unified_bank.json against data/provenance.json
      # before it copies anything, so a bank edited by hand fails here.
      - run: npm run build
      - name: Every module the page imports is in dist/
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html app.js settings.js runner.js render.js gateway.js \
                      bank.json lib/bank.mjs lib/challenges.mjs lib/fingerprint.mjs \
                      lib/probe.mjs lib/report.mjs; do
            test -f "dist/$file" || { echo "dist/$file is missing"; exit 1; }
          done
          echo "the site is complete"

  parity:
    name: Parity with ModelTrace's scorer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      # Clones xqy2006/ModelTrace and scores its reference answers with both
      # scorers. This is the check that keeps the port honest: a refactor here
      # that changes a probability fails, however tidy it looks.
      - run: node scripts/verify-parity.mjs
